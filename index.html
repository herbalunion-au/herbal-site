<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herbal Union | Practitioner‑only Prescription Portal — 草本合</title>
  <meta name="description" content="Practitioner‑only Chinese herbal granule/powder portal with bilingual CN/EN content.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-amber-50 text-stone-900">
  <main class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-6 text-center">Herbal Union — Practitioner Portal</h1>

    <section id="forms" class="space-y-10">
      <div class="card">
        <h2 class="text-xl font-semibold mb-2">A) New client — I have a valid prescription</h2>
        <form name="rx-with-valid" method="POST" data-netlify="true" enctype="multipart/form-data" class="space-y-3">
          <input type="hidden" name="form-name" value="rx-with-valid">
          <input type="hidden" name="redirect" value="/thanks.html">
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="full_name" placeholder="Full name / 姓名" required>
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="email" type="email" placeholder="Email / 邮箱" required>
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="rx_file" type="file" accept=".pdf,.jpg,.jpeg,.png" required>
          <button class="px-4 py-2 rounded-xl bg-emerald-700 text-white" type="submit">Submit / 提交</button>
        </form>
      </div>

      <div class="card">
        <h2 class="text-xl font-semibold mb-2">B) New client — I need a consultation</h2>
        <form name="rx-needs-consult" method="POST" data-netlify="true" enctype="multipart/form-data" class="space-y-3">
          <input type="hidden" name="form-name" value="rx-needs-consult">
          <input type="hidden" name="redirect" value="/thanks.html">
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="full_name" placeholder="Full name / 姓名" required>
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="email" type="email" placeholder="Email / 邮箱" required>
          <textarea class="w-full border border-amber-300 rounded-lg px-3 py-2" name="symptoms" placeholder="Brief symptoms / 简要症状" required></textarea>
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="attachment" type="file" accept=".pdf,.jpg,.jpeg,.png">
          <button class="px-4 py-2 rounded-xl bg-emerald-700 text-white" type="submit">Request / 预约</button>
        </form>
      </div>

      <div class="card">
        <h2 class="text-xl font-semibold mb-2">C) Existing client — Reorder</h2>
        <form name="rx-refill" method="POST" data-netlify="true" enctype="multipart/form-data" class="space-y-3">
          <input type="hidden" name="form-name" value="rx-refill">
          <input type="hidden" name="redirect" value="/thanks.html">
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="full_name" placeholder="Full name / 姓名" required>
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="email" type="email" placeholder="Email / 邮箱" required>
          <input class="w-full border border-amber-300 rounded-lg px-3 py-2" name="formula_name" placeholder="Formula name (if known) / 配方名（如已知）">
          <button class="px-4 py-2 rounded-xl bg-emerald-700 text-white" type="submit">Reorder / 续配</button>
        </form>
      </div>
    </section>

    <p class="text-center mt-10 text-sm text-stone-600">
      Email: <a href="mailto:lovetcmau@gmail.com" class="underline">lovetcmau@gmail.com</a> · WeChat: CJReunion · WhatsApp: +61 452 066 631
    </p>
  </main>
</body>
</html>
